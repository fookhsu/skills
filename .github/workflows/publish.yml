name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish codebase-lens to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Validate packages
        run: npm run validate

      - name: Check tag matches package version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./packages/codebase-lens/package.json').version")"
          if [ "${TAG_VERSION}" != "${PKG_VERSION}" ]; then
            echo "::error::Tag v${TAG_VERSION} does not match package version ${PKG_VERSION}"
            exit 1
          fi
          echo "Publishing codebase-lens@${PKG_VERSION}"

      - name: Diagnose publish environment
        run: |
          echo "npm $(npm --version)"
          if [ -z "${NODE_AUTH_TOKEN+x}" ]; then
            echo "NODE_AUTH_TOKEN undefined (good for OIDC)"
          else
            echo "NODE_AUTH_TOKEN set (bad for OIDC)"
          fi
          if [ -n "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "OIDC endpoint present (good)"
          else
            echo "OIDC endpoint missing (bad)"
          fi

      - name: Pack the package
        run: npm pack --workspace packages/codebase-lens --pack-destination "$RUNNER_TEMP"

      - name: Publish to npm
        working-directory: ${{ runner.temp }}
        run: npm publish codebase-lens-*.tgz --loglevel verbose
