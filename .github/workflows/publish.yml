name: Publish

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      package:
        description: "Package name or directory under packages/ to publish (default: every package)"
        required: false
        type: string

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    name: Publish skill packages to npm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Ensure npm supports trusted publishing
        run: npm install -g npm@^11.5.1

      - name: Install dependencies
        run: npm ci

      - name: Validate packages
        run: npm run validate

      # A v<version> tag publishes every package sitting at that version: with
      # independently versioned packages the tag names the release, not a package.
      # npm has no pending-publisher support, so the first release of a new package
      # name is bootstrapped by hand once; after that this workflow is the publisher.
      # Versions already on the registry are skipped, so re-pushing a tag is a no-op.
      - name: Resolve packages to publish
        id: resolve
        env:
          INPUT_PACKAGE: ${{ inputs.package }}
        run: |
          node - <<'NODE'
          const { readdirSync, readFileSync, appendFileSync } = require("node:fs");
          const { execFileSync } = require("node:child_process");

          const isTag = process.env.GITHUB_EVENT_NAME === "push";
          const tagVersion = isTag ? process.env.GITHUB_REF_NAME.replace(/^v/, "") : "";
          const filter = (process.env.INPUT_PACKAGE || "").trim();
          const matched = [];
          const publishable = [];

          for (const entry of readdirSync("packages", { withFileTypes: true })) {
            if (!entry.isDirectory()) continue;
            const manifest = JSON.parse(readFileSync(`packages/${entry.name}/package.json`, "utf8"));
            if (filter && filter !== entry.name && filter !== manifest.name) continue;
            if (tagVersion && manifest.version !== tagVersion) continue;
            matched.push({ dir: entry.name, name: manifest.name, version: manifest.version });
          }

          if (matched.length === 0) {
            console.error(
              isTag
                ? `No package is at version ${tagVersion} — tag v${tagVersion} does not match any package.json.`
                : `No package matches "${filter}".`,
            );
            process.exit(1);
          }

          for (const pkg of matched) {
            let onRegistry = false;
            try {
              onRegistry =
                execFileSync("npm", ["view", `${pkg.name}@${pkg.version}`, "version"], {
                  stdio: ["ignore", "pipe", "ignore"],
                })
                  .toString()
                  .trim().length > 0;
            } catch {
              // 404 means the version is unpublished, which is the normal case.
            }
            if (onRegistry) {
              console.log(`skip ${pkg.name}@${pkg.version}: already on the registry`);
              continue;
            }
            publishable.push(pkg);
          }

          appendFileSync(process.env.GITHUB_OUTPUT, `packages=${publishable.map((p) => p.dir).join(" ")}\n`);
          console.log(
            publishable.length
              ? `Will publish: ${publishable.map((p) => `${p.name}@${p.version}`).join(", ")}`
              : "Nothing to publish: every matching version is already on the registry.",
          );
          NODE

      # npm's OIDC exchange misresolves nested workspace packages, so
      # `npm publish --workspace` falls back to token auth and fails with
      # ENEEDAUTH. Pack each package, then publish the tarballs from outside
      # the workspace so npm resolves the package identity from the tarball.
      - name: Pack the packages
        if: steps.resolve.outputs.packages != ''
        run: |
          for pkg in ${{ steps.resolve.outputs.packages }}; do
            npm pack --workspace "packages/$pkg" --pack-destination "$RUNNER_TEMP"
          done

      - name: Publish to npm
        if: steps.resolve.outputs.packages != ''
        working-directory: ${{ runner.temp }}
        run: |
          for tarball in ./*.tgz; do
            echo "Publishing ${tarball}"
            npm publish "${tarball}"
          done
